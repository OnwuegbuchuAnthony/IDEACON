# Netlify production build for IDEACON (Next.js in app/, local-first stack).
# Repo: OnwuegbuchuAnthony/IDEACON — import from GitHub in the Netlify dashboard.
[build]
  base = "app"
  command = "npx prisma generate && npm run build"
  publish = ".next"

# Server-only secrets live in function bundles (never sent to browsers —
# verified: only NEXT_PUBLIC_APP_URL is public). Omit them from secrets
# scanning per https://ntl.fyi/configure-secrets-scanning.
[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "DATABASE_URL BETTER_AUTH_SECRET PAYSTACK_SECRET_KEY GROQ_API_KEY RESEND_API_KEY R2_SECRET_ACCESS_KEY"

# Explicit Next.js runtime (SSR + routing); auto-detect alone left functions empty.
[[plugins]]
  package = "@netlify/plugin-nextjs"
