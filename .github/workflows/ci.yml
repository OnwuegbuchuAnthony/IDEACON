name: ci
on:
  push:
    paths:
      - "app/**"
  pull_request:
    paths:
      - "app/**"

defaults:
  run:
    working-directory: app

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Prisma config requires DATABASE_URL during generate; CI does not connect to this placeholder.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ideacon_ci
      # Better Auth validates these at module load while collecting page data.
      # Build-only placeholders (never used to sign real sessions).
      BETTER_AUTH_SECRET: ci-build-only-placeholder-secret-not-a-real-key
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
