# Self-hosted IDEACON on local device. No Vercel, no Supabase.
# Usage: copy .env.example to .env.local, then `docker compose up -d`
# (Local Postgres already runs natively; compose db is for parity/CI.)
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ideacon
      # No default committed (secrets scanners flag literals). Export POSTGRES_PASSWORD first.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your shell}
      POSTGRES_DB: ideacon
    ports:
      - "5433:5432"
    volumes:
      - ideacon-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Umami analytics, self-hosted (MIT, cookie-free). Own database.
  umami-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD in your shell}
      POSTGRES_DB: umami
    volumes:
      - umami-pgdata:/var/lib/postgresql/data

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    depends_on:
      - umami-db
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD in your shell}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET in your shell}
      TRACKER_SCRIPT_NAME: script.js
    ports:
      - "3001:3000"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://ideacon:ideacon_local_dev@db:5432/ideacon
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    env_file:
      - .env.local
    ports:
      - "3000:3000"

volumes:
  ideacon-pgdata:
  umami-pgdata:
